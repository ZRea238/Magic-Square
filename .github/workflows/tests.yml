name: Unit Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  isolated-solvers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: python-solver-adapter
            command: python -m unittest tests.test_solver
            setup_go: "false"
          - name: go-solver
            command: python -m unittest tests.test_go_solver
            setup_go: "true"
          - name: cpp-solver
            command: python -m unittest tests.test_cpp_solver
            setup_go: "false"

    name: isolated-${{ matrix.suite.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        if: matrix.suite.setup_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run isolated suite
        run: ${{ matrix.suite.command }}
